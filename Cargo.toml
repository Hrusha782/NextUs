[package]
name = "nextus"
version = "0.1.0"
edition = "2021"
description = "A pure, deterministic DSL for building messenger UIs"
license = "MIT"
authors = ["NextUs Team"]

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[bin]]
name = "nextus"
path = "src/main.rs"

[[bin]]
name = "nextus-lsp"
path = "src/lsp/main.rs"

[lib]
name = "nextus"
path = "src/lib.rs"
